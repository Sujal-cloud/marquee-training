<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Grid</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: rgb(122, 26, 108);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container{
            display: grid;
            grid-template-columns: repeat(3, 200px);
            grid-template-rows: repeat(3, 150px);
            gap: 8px;
        }

        .box1,
        .box2,
        .box3,
        .box4{
            background-color: rgb(77, 4, 77);
            border-radius: 20px;
            color: white;
            position: relative;
        }

        .box1{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }

        .box2{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
        }

        .box2 span{
            position: absolute;
            bottom: 12px;
            font-size: 12px;
            font-weight: normal;
        }

        .box3{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
        }

        .box3 span{
            position: absolute;
            bottom: 12px;
            font-size: 12px;
            font-weight: normal;
        }

        .box4{
            position: relative;
        }

        .box4 p{
            position: absolute;
            margin: 0;
        }

        .box4 p:first-child{
            top: 12px;
            left: 12px;
            font-size: 12px;
        }

        .box4 p:last-child{
            top: 50%;
            left: 50%;
            font-size: 40px;
            font-weight: 700;
            margin-left: -50px;
            margin-top: -20px;
        }

        .box5{
            background-color: rgb(11, 34, 105);
            border-radius: 20px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .box6{
            background-color: white;
            color: black;
            grid-column: 3 / 4;
            grid-row: 2 / 4;
            border-radius: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            font-size: 60px;
            padding: 12px;
        }

        .box7{
            grid-column: 1 / 3;
            background-color: rgb(77, 4, 77);
            color: white;
            border-radius: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            font-size: 18px;
            padding: 12px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box1"></div>

        <div class="box2">
            25K
            <span>Weekly Likes</span>
        </div>

        <div class="box3">
            50K
            <span>Weekly Views</span>
        </div>

        <div class="box4">
            <p>Active users</p>
            <p>1,538</p>
        </div>

        <div class="box5">
            DESIGN
        </div>

        <div class="box6">
            200K
        </div>

        <div class="box7">
            A place to learn UI design & <br>Web Design
        </div>

    </div>

</body>
</html>
